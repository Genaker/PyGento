<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PyGento{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600">PyGento</a>
            <span class="text-sm text-gray-500">SQLAlchemy over a real Magento database</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-200 mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-gray-500">
            PyGento &mdash; <a href="https://github.com/Genaker/PyGento" class="underline">github.com/Genaker/PyGento</a>
        </div>
    </footer>
</body>
</html>
